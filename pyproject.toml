[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "dsa-editor"
version = "0.2.0"
description = "A C11 terminal editor with a live Python data-structure visualizer"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "DSA Editor contributors" }]
# The editor is a standalone C binary.  The Python side is only the visualizer
# plus the read-only bridge library it imports; both use the standard library.
dependencies = []

[project.scripts]
anvil-viz = "dsa_visualizer.cli:main"
dsa-visualizer = "dsa_visualizer.cli:main"

[tool.setuptools.packages.find]
include = ["dsa_editor*", "dsa_visualizer*"]
